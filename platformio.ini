 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = board

[env]
platform_packages = 
	framework-industrialshields-esp32@https://apps.industrialshields.com/main/arduino/boards/industrialshields-boards-esp32-2.2.4.tar.bz2

[env:board]
platform = https://github.com/Industrial-Shields/platform-industrialshields-esp32.git
board = 14iosplc_ma
custom_version = 4
custom_click1 = None
custom_click2 = None
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
    SPI
    SD
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.5.2
; NimBLE callbacks run on the host task and need the stack Bluedroid gave them
; (they hold 512-byte buffers and do AES). One phone, peripheral role only.
build_flags =
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=20
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; src/spi_bus_switch.cpp: moves GPIO4 on every SPI transaction.
    -Wl,--wrap=_ZN8SPIClass16beginTransactionE11SPISettings
    -Wl,--wrap=ff_diskio_register

; TLS-over-W5500 feasibility test, bench use only: NOT crane firmware.
; Builds src/spike/ alone. Flashing it replaces the crane firmware until
; env:board is uploaded again.
[env:tls_spike]
extends = env:board
build_src_filter = -<*> +<spike/>
build_flags = -DTLS_SPIKE=1
